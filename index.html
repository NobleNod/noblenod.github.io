<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Talk | Hariharan R</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f1f5f9;
        }

        .container {
            max-width: 480px;
            text-align: center;
        }

        .emoji {
            font-size: 48px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #a78bfa 0%, #818cf8 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            font-size: 1.125rem;
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 32px;
        }

        .highlight {
            color: #ffffff;
            font-weight: 500;
        }

        .credibility {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .credibility p {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .credibility strong {
            color: #ffffff;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.125rem;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 50px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        .whatsapp-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .footer {
            margin-top: 48px;
            font-size: 0.875rem;
            color: #475569;
        }

        .footer a {
            color: #64748b;
            text-decoration: none;
        }

        .footer a:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">💬</div>
        <h1>Let's Talk</h1>
        
        <p class="description">
            Preparing for placements? Wondering what interviewers <span class="highlight">actually</span> look for?
        </p>

        <div class="credibility">
            <p>
                I've conducted <strong>100+ technical interviews at Amazon</strong>. I know what gets candidates hired — and what gets them rejected in the first 10 minutes.
            </p>
        </div>

        <a href="https://wa.me/16177495635?text=Hi%20Hari%2C%20I%20found%20you%20on%20LinkedIn%20and%20wanted%20to%20chat%20about%20placements" 
           class="whatsapp-btn" 
           target="_blank"

            Message me on WhatsApp
        </a>

        <div class="footer">
            <a href="https://www.linkedin.com/in/noblenod" target="_blank">LinkedIn</a>
        </div>
    </div>
</body>
</html>
